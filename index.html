</script><style id="grammarMultiDropdownStyles">

</style><script id="multiTopicScript">
(function(){
  const select=document.getElementById('topic');
  if(!select)return;
  const originalItems=Array.from(select.options).map(o=>({value:o.value,name:o.textContent}));
  const names=originalItems.filter(x=>x.value!=='ALL' && x.value!=='MIXED GRAMMAR').map(x=>x.value);
  const mixed=originalItems.find(x=>x.value==='ALL'||x.value==='MIXED GRAMMAR');
  const allValue=mixed?mixed.value:'ALL';
  const custom='__MULTIPLE_TOPICS__';
  const customOption=document.createElement('option');customOption.value=custom;customOption.textContent='SELECTED TOPICS';select.add(customOption);
  let chosen=new Set(),draft=new Set(),mixedDraft=true,wasChanged=false;
  window.grammarTopicsMatch=function(category){return select.value===allValue||select.value==='MIXED GRAMMAR'||(select.value===custom?chosen.has(category):select.value===category)};
  window.grammarTopicKey=function(){return select.value===custom?'MULTI:'+Array.from(chosen).sort().join('|'):select.value};

  // Keep the native select for the original game logic and geometry, but replace its
  // visible surface with a checkbox dropdown, in exactly the same screen position.
  const computed=getComputedStyle(select);
  select.style.visibility='hidden';
  const display=document.createElement('button');display.type='button';display.id='grammarMultiSelect';
  display.setAttribute('aria-label','Choose one or more grammar topics');
  display.setAttribute('aria-haspopup','true');display.setAttribute('aria-expanded','false');
  display.style.cssText='position:fixed;z-index:2147482000;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-width:0;line-height:1.25;';
  display.style.backgroundColor=computed.backgroundColor;
  display.style.color=computed.color;
  display.style.border=computed.border;
  display.style.borderRadius=computed.borderRadius;
  display.style.fontFamily=computed.fontFamily;
  display.style.fontWeight=computed.fontWeight;
  document.body.appendChild(display);
  function describe(){
    if(select.value===allValue||select.value==='MIXED GRAMMAR')return 'MIXED GRAMMAR';
    if(select.value===custom)return chosen.size===1?Array.from(chosen)[0]:chosen.size+' TOPICS SELECTED';
    return select.value;
  }
  function showSelection(){display.textContent='';const label=document.createElement('span');label.textContent=describe();label.style.cssText='overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;flex:1';const arrow=document.createElement('span');arrow.textContent='▾';arrow.style.flex='none';display.append(label,arrow)}
  function position(){
    const r=select.getBoundingClientRect();
    display.style.left=r.left+'px';display.style.top=r.top+'px';display.style.width=r.width+'px';display.style.height=r.height+'px';
    display.style.padding=`0 ${Math.max(7,Math.min(13,r.height*.24))}px`;
    display.style.fontSize=Math.max(9,Math.min(15,r.height*.37))+'px';
    if(dropdown.classList.contains('open'))positionDropdown();
  }
  const dropdown=document.createElement('div');dropdown.id='grammarMultiDropdown';dropdown.setAttribute('role','dialog');dropdown.setAttribute('aria-label','Grammar topics');
  dropdown.innerHTML='<div class="gm-searchbox"><input type="search" class="gm-search" placeholder="Search topics..." aria-label="Search grammar topics"></div><div class="gm-list"></div><div class="gm-footer"><span class="gm-count"></span><button type="button" class="gm-done">DONE ✓</button></div>';
  document.body.appendChild(dropdown);
  const search=dropdown.querySelector('.gm-search'),list=dropdown.querySelector('.gm-list'),count=dropdown.querySelector('.gm-count');
  function positionDropdown(){
    const r=display.getBoundingClientRect(),vw=innerWidth,vh=innerHeight;
    const width=Math.min(410,Math.max(r.width,285),vw-16);
    dropdown.style.width=width+'px';
    dropdown.style.left=Math.max(8,Math.min(r.left,vw-width-8))+'px';
    const roomBelow=vh-r.bottom-10,roomAbove=r.top-10;
    const maxH=Math.max(190,Math.min(505,Math.max(roomBelow,roomAbove)));
    dropdown.style.maxHeight=maxH+'px';
    if(roomBelow>=Math.min(290,maxH)||roomBelow>=roomAbove){dropdown.style.top=Math.max(7,r.bottom+4)+'px';dropdown.style.bottom='auto';}
    else{dropdown.style.top='auto';dropdown.style.bottom=(vh-r.top+4)+'px';}
  }
  function countUpdate(){count.textContent=mixedDraft?'ALL TOPICS':draft.size+' SELECTED'}
  function render(){
    const term=search.value.trim().toLocaleLowerCase();list.replaceChildren();
    function addItem(name,value,isMixed){
      if(!name.toLocaleLowerCase().includes(term))return;
      const row=document.createElement('label');row.className='gm-row';
      const check=document.createElement('input');check.type='checkbox';check.checked=isMixed?mixedDraft:(!mixedDraft&&draft.has(value));
      const txt=document.createElement('span');txt.textContent=name;
      row.append(check,txt);
      check.addEventListener('change',()=>{
        if(isMixed){mixedDraft=true;draft.clear();}
        else{
          if(mixedDraft){mixedDraft=false;draft.clear();}
          if(check.checked)draft.add(value);else draft.delete(value);
        }
        wasChanged=true;render();
      });
      list.appendChild(row);
    }
    addItem('MIXED GRAMMAR — ALL TOPICS',allValue,true);
    for(const n of names)addItem(n,n,false);
    countUpdate();
  }
  function open(){
    if(dropdown.classList.contains('open')){close(true);return}
    mixedDraft=select.value===allValue||select.value==='MIXED GRAMMAR';
    draft=select.value===custom?new Set(chosen):mixedDraft?new Set():new Set([select.value]);
    wasChanged=false;search.value='';render();dropdown.classList.add('open');display.setAttribute('aria-expanded','true');positionDropdown();search.focus();
  }
  function close(commit){
    if(!dropdown.classList.contains('open'))return;
    if(commit&&wasChanged){
      if(!mixedDraft&&draft.size===0){count.textContent='CHOOSE AT LEAST ONE';return}
      if(mixedDraft){select.value=allValue;chosen.clear()}
      else{chosen=new Set(draft);select.value=custom}
      showSelection();
      select.dispatchEvent(new Event('change',{bubbles:true}));
    }
    dropdown.classList.remove('open');display.setAttribute('aria-expanded','false');display.focus();
  }
  display.addEventListener('click',open);
  search.addEventListener('input',render);
  dropdown.querySelector('.gm-done').addEventListener('click',()=>close(true));
  document.addEventListener('pointerdown',e=>{if(dropdown.classList.contains('open')&&!dropdown.contains(e.target)&&!display.contains(e.target))close(true)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dropdown.classList.contains('open')){e.preventDefault();close(false)}});
  window.addEventListener('resize',position);
  window.addEventListener('scroll',position,true);
  if(window.ResizeObserver){new ResizeObserver(position).observe(select)}
  select.addEventListener('change',showSelection);
  showSelection();position();requestAnimationFrame(position);
})();
</script></body></html>
